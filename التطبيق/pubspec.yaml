name: ikill_native
description: Native Android and iOS client for iKILL Pest Control Services.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.8.4
  app_links: 6.4.0
  firebase_core: 3.12.1
  firebase_messaging: 15.2.4
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  image_picker: 1.1.2
  flutter_svg: ^2.0.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/pests/
    - assets/images/partners-webp/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
          weight: 400
        - asset: assets/fonts/Cairo.ttf
          weight: 500
        - asset: assets/fonts/Cairo.ttf
          weight: 600
        - asset: assets/fonts/Cairo.ttf
          weight: 700
        - asset: assets/fonts/Cairo.ttf
          weight: 800
        - asset: assets/fonts/Cairo.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 800
        - asset: assets/fonts/Inter.ttf
          weight: 900
