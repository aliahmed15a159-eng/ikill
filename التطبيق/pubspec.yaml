name: ikill_native
description: Native Android and iOS client for iKILL Pest Control Services.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/pests/
    - assets/images/partners-webp/
