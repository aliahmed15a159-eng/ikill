name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'التطبيق/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: التطبيق
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Prepare Android Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          raw = os.environ.get('GOOGLE_SERVICES_JSON', '')
          if not raw.strip():
              raise SystemExit('Missing GOOGLE_SERVICES_JSON repository Actions secret. Add the Android Firebase client JSON in repository Settings > Secrets and variables > Actions.')
          with tempfile.TemporaryDirectory() as directory:
              config = Path(directory) / 'google-services.json'
              config.write_text(raw)
              subprocess.run(['python3', 'tool/configure_firebase.py', '--android', str(config)], check=True)
          PY
      - name: Build Android APK with Firebase
        run: flutter build apk --debug --dart-define-from-file=firebase_build.json
      - uses: actions/upload-artifact@v4
        with:
          name: ikill-android-debug
          path: التطبيق/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
